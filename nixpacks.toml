[phases.build]
cmds = [
  "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache",
  "composer install --no-dev --optimize-autoloader",
  "npm ci && npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan route:clear && php artisan view:clear && php artisan event:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
